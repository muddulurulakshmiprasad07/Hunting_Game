
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wild Hunt - Hunting Game</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #101b12;
    color: white;
    overflow: hidden;
}

.game {
    width: 100%;
    height: 100vh;
    position: relative;
    background:
    linear-gradient(to bottom, transparent 35%, #142819 100%),
    linear-gradient(#86a9a1 0%, #496e4d 45%, #172d19 100%);
    overflow: hidden;
    cursor: crosshair;
}

/* Forest scenery */

.sun {
    position: absolute;
    top: 70px;
    right: 15%;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: #f5d58b;
    box-shadow: 0 0 70px #f5d58b;
}

.mountains {
    position: absolute;
    bottom: 35%;
    width: 100%;
    height: 250px;
    background: #344e3a;
    clip-path: polygon(0 80%, 15% 25%, 30% 75%,
    48% 10%, 65% 75%, 82% 20%, 100% 80%,
    100% 100%, 0 100%);
}

.ground {
    position: absolute;
    bottom: 0;
    height: 37%;
    width: 100%;
    background: linear-gradient(#34532d, #101b12);
}

.tree {
    position: absolute;
    bottom: 30%;
    width: 70px;
    height: 180px;
    background: #35291e;
    clip-path: polygon(40% 100%, 40% 35%, 0 35%,
    50% 0, 100% 35%, 60% 35%, 60% 100%);
}

.tree.one { left: 5%; transform: scale(1.3); }
.tree.two { right: 8%; transform: scale(1.7); }
.tree.three { left: 75%; transform: scale(1.1); }

/* Header */

.header {
    position: absolute;
    top: 20px;
    width: 100%;
    text-align: center;
    z-index: 5;
}

.header h1 {
    font-size: 38px;
    color: #f5d58b;
    letter-spacing: 5px;
    text-shadow: 2px 3px 5px black;
}

.header p {
    margin-top: 7px;
    letter-spacing: 2px;
}

/* Score board */

.scoreboard {
    position: absolute;
    top: 110px;
    left: 25px;
    z-index: 5;
    background: #101b12cc;
    padding: 18px 25px;
    border: 1px solid #b4a16c;
    border-radius: 12px;
    line-height: 2;
}

.scoreboard span {
    color: #f5d58b;
    font-weight: bold;
}

/* Animals */

.animal {
    position: absolute;
    bottom: 28%;
    font-size: 65px;
    cursor: crosshair;
    user-select: none;
    z-index: 3;
    transition: transform 0.1s;
    filter: drop-shadow(3px 5px 3px #111);
}

.animal:hover {
    transform: scale(1.12);
}

/* Buttons */

button {
    padding: 14px 30px;
    border: none;
    border-radius: 8px;
    background: #d5a94c;
    color: #172112;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #ffe09a;
    transform: scale(1.05);
}

.start-screen, .game-over {
    position: absolute;
    inset: 0;
    background: #07120dd9;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    text-align: center;
    gap: 20px;
}

.start-screen h2, .game-over h2 {
    color: #f5d58b;
    font-size: 42px;
}

.start-screen p {
    font-size: 17px;
    line-height: 1.8;
}

.game-over {
    display: none;
}

.message {
    position: absolute;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 25px;
    color: #fff2ae;
    z-index: 8;
    pointer-events: none;
}

@media(max-width:600px) {
    .header h1 { font-size: 25px; }
    .scoreboard { top: 100px; left: 10px; padding: 10px; }
}
</style>
</head>

<body>

<div class="game" id="game">

    <div class="sun"></div>
    <div class="mountains"></div>
    <div class="ground"></div>

    <div class="tree one"></div>
    <div class="tree two"></div>
    <div class="tree three"></div>

    <div class="header">
        <h1>WILD HUNT</h1>
        <p>THE ULTIMATE FOREST CHALLENGE</p>
    </div>

    <div class="scoreboard">
        <div>🎯 Score: <span id="score">0</span></div>
        <div>⏱ Time: <span id="timer">60</span>s</div>
        <div>🏹 Hits: <span id="hits">0</span></div>
    </div>

    <div class="message" id="message"></div>

    <div class="start-screen" id="startScreen">
        <h2>🌲 WILD HUNT</h2>
        <p>
            Welcome to the Forest!<br>
            Aim and click on the moving animals.<br>
            Score as many points as possible in 60 seconds.
        </p>
        <button onclick="startGame()">START GAME</button>
    </div>

    <div class="game-over" id="gameOver">
        <h2>GAME OVER!</h2>
        <h3>Your Final Score: <span id="finalScore">0</span></h3>
        <p>Great job, Hunter!</p>
        <button onclick="startGame()">PLAY AGAIN</button>
    </div>

</div>

<script>

const game = document.getElementById("game");

let score = 0;
let hits = 0;
let time = 60;
let playing = false;
let timerInterval;
let animalInterval;
let animals = [];

// Create an animal

function createAnimal() {

    if (!playing) return;

    const animal = document.createElement("div");
    animal.className = "animal";

    const types = ["🦌", "🐇", "🦊"];
    animal.innerHTML = types[Math.floor(Math.random() * types.length)];

    const gameWidth = game.clientWidth;

    animal.style.left = "-80px";
    animal.style.bottom = (22 + Math.random() * 15) + "%";

    game.appendChild(animal);

    const speed = 2 + Math.random() * 3;

    const object = {
        element: animal,
        x: -80,
        speed: speed
    };

    animals.push(object);

    animal.addEventListener("click", function(e) {

        e.stopPropagation();

        if (!playing) return;

        score += 10;
        hits++;

        document.getElementById("score").innerText = score;
        document.getElementById("hits").innerText = hits;

        showMessage("+10 POINTS!");

        removeAnimal(object);

    });

}

// Remove animal

function removeAnimal(object) {

    object.element.remove();

    animals = animals.filter(a => a !== object);

}

// Move animals

function moveAnimals() {

    if (!playing) return;

    animals.forEach(object => {

        object.x += object.speed;

        object.element.style.left = object.x + "px";

        if (object.x > game.clientWidth) {
            removeAnimal(object);
        }

    });

    requestAnimationFrame(moveAnimals);

}

// Message

function showMessage(text) {

    const message = document.getElementById("message");

    message.innerText = text;

    setTimeout(() => {
        message.innerText = "";
    }, 600);

}

// Start game

function startGame() {

    score = 0;
    hits = 0;
    time = 60;
    playing = true;

    animals.forEach(a => a.element.remove());
    animals = [];

    document.getElementById("score").innerText = 0;
    document.getElementById("hits").innerText = 0;
    document.getElementById("timer").innerText = 60;

    document.getElementById("startScreen").style.display = "none";
    document.getElementById("gameOver").style.display = "none";

    clearInterval(timerInterval);
    clearInterval(animalInterval);

    animalInterval = setInterval(createAnimal, 1200);

    timerInterval = setInterval(() => {

        time--;

        document.getElementById("timer").innerText = time;

        if (time <= 0) {
            endGame();
        }

    }, 1000);

    moveAnimals();

}

// End game

function endGame() {

    playing = false;

    clearInterval(timerInterval);
    clearInterval(animalInterval);

    animals.forEach(a => a.element.remove());
    animals = [];

    document.getElementById("finalScore").innerText = score;
    document.getElementById("gameOver").style.display = "flex";

}

// Click empty space

game.addEventListener("click", function(e) {

    if (playing && !e.target.classList.contains("animal")) {
        showMessage("MISSED!");
    }

});

</script>

</body>
</html>
